<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <!-- Neo-brutalist hard drop shadow -->
    <filter id="neoHoverShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="1.8" stdDeviation="0.4" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Live Radiating Soundwaves from Tip (4.5, 4.5) -->
  <g transform="translate(4.5, 4.5) rotate(-45)">
    <!-- Shockwave 1 (Inner intense pulse) -->
    <path d="M -5.5 -2.2 C -3 -5.2, 3 -5.2, 5.5 -2.2" stroke="#FF1E27" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Shockwave 2 (Outer radiating pulse) -->
    <path d="M -8.5 -4.8 C -4.5 -9.5, 4.5 -9.5, 8.5 -4.8" stroke="#E50914" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
    
    <!-- Shockwave 3 (Subtle ambient ring) -->
    <path d="M -11 -7 C -5.5 -13, 5.5 -13, 11 -7" stroke="#E50914" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- The Animated Mic Body -->
  <g transform="translate(4.5, 4.5) rotate(-45)" filter="url(#neoHoverShadow)">
    
    <!-- XLR Base Plug & Pin -->
    <rect x="-1.8" y="26.5" width="3.6" height="3.2" rx="0.8" fill="#111111" stroke="#FFFFFF" stroke-width="0.8"/>
    <circle cx="0" cy="30" r="1.1" fill="#FF1E27" stroke="#FFFFFF" stroke-width="0.5"/>

    <!-- Tapered Handle (Cinema Obsidian) -->
    <path d="M -3 16.5 L 3 16.5 L 2.2 26.5 L -2.2 26.5 Z" fill="#181818" stroke="#FFFFFF" stroke-width="1.0" stroke-linejoin="round"/>
    
    <!-- Grip Ribs -->
    <line x1="-2.7" y1="21.5" x2="2.7" y2="21.5" stroke="#444444" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-2.5" y1="24" x2="2.5" y2="24" stroke="#444444" stroke-width="0.8" stroke-linecap="round"/>
    
    <!-- Red Accent Collar Band (Energized) -->
    <rect x="-2.9" y="17.2" width="5.8" height="1.5" rx="0.3" fill="#FF1E27"/>

    <!-- Netflix Mic Flag (Neo-Brutalist Square Box) -->
    <rect x="-5.5" y="9.8" width="11" height="6.6" rx="1" fill="#141414" stroke="#FFFFFF" stroke-width="1.1"/>
    
    <!-- Iconic Netflix "N" Logo on Flag -->
    <!-- Left Stem (Dark Crimson) -->
    <rect x="-2.6" y="10.8" width="1.2" height="4.6" rx="0.2" fill="#B80710"/>
    <!-- Right Stem (Dark Crimson) -->
    <rect x="1.4" y="10.8" width="1.2" height="4.6" rx="0.2" fill="#B80710"/>
    <!-- Canonical Netflix Red Diagonal Ribbon (Hot glowing) -->
    <polygon points="-2.6,10.8 -1.4,10.8 2.6,15.4 1.4,15.4" fill="#FF1E27"/>

    <!-- "ON AIR" Live Red Beacon Dot on side of flag -->
    <circle cx="7.2" cy="13.1" r="2.2" fill="#FF1E27" stroke="#FFFFFF" stroke-width="0.6"/>
    <circle cx="7.2" cy="13.1" r="0.9" fill="#FFFFFF"/>

    <!-- Collar Chrome Ring -->
    <rect x="-4" y="8" width="8" height="1.8" rx="0.4" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>

    <!-- Live Glowing Netflix Red Pop Filter / Capsule -->
    <path d="M -4.6 5 C -4.6 1.8, -2.6 0, 0 0 C 2.6 0, 4.6 1.8, 4.6 5 L 4.6 8 L -4.6 8 Z" fill="#FF1E27" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
    
    <!-- Pop Filter Grille Seam -->
    <line x1="-4.4" y1="5.2" x2="4.4" y2="5.2" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.8"/>
    
    <!-- Top Live Sparkle -->
    <circle cx="0" cy="2.2" r="1.1" fill="#FFFFFF"/>
    
    <!-- Specular Highlight Sheen -->
    <path d="M -2.8 2.2 C -3.6 3.4, -3.6 5, -3.6 6.2" stroke="#FFFFFF" stroke-width="0.95" stroke-linecap="round"/>
  </g>
</svg>